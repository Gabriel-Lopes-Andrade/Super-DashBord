<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Desafio 5 — Massa</title>
</head>
<body>

    <header>
        <h1>Painel de Ferramentas</h1>
    </header>

    <main>

        <!-- BARRA LATERAL: Desafio 5 com classe "ativo" -->
        <section>
            <ul>
                <li><a href="desafio1.html">Desafio 1</a></li>
                <li><a href="desafio2.html">Desafio 2</a></li>
                <li><a href="desafio3.html">Desafio 3</a></li>
                <li><a href="desafio4.html">Desafio 4</a></li>
                <li><a href="desafio5.html" class="ativo">Desafio 5</a></li>
                <li><a href="desafio6.html">Desafio 6</a></li>
            </ul>
        </section>

        <!-- ÁREA CENTRAL: card do desafio -->
        <section>
            <div class="card-desafio">

                <h2>Desafio 5 — Conversor de Massa</h2>

                <div class="campo">
                    <label for="valor-massa">Valor</label>
                    <input type="number" id="valor-massa" placeholder="Ex: 70">
                </div>

                <div class="campo">
                    <label for="direcao-massa">Converter de</label>
                    <select id="direcao-massa">
                        <option value="kg-lbs">kg → lbs</option>
                        <option value="lbs-kg">lbs → kg</option>
                    </select>
                </div>

                <button class="btn-calcular" id="btn-massa">Converter</button>

                <div class="resultado" id="resultado-massa">
                    O resultado aparecerá aqui.
                </div>

            </div>
        </section>

    </main>
